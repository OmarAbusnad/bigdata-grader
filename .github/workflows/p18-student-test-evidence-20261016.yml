name: P18 Frozen SHA Student Tests and Documentation Evidence
on:
  push:
    paths:
      - '.grader/trigger-p18-student-tests-20261016.txt'
permissions:
  contents: read
jobs:
  p18-student-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch student exact frozen P18
        shell: bash
        run: |
          set -euo pipefail
          git clone -q https://github.com/aimanqais1/big-data-pipeline-project.git student
          git -C student checkout -q --detach 2024f325c24c3626c30193ab27945d9440093c25
          test "$(git -C student rev-parse HEAD)" = "2024f325c24c3626c30193ab27945d9440093c25"
      - name: Install pytest only, without adding or altering student source
        run: python -m pip install pytest
      - name: Run frozen actual student data-quality unit tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast,json,pathlib,re
          root=pathlib.Path('student')
          testfiles=list(root.glob('tests/test_*.py'))
          out=[]
          for path in testfiles:
              x=ast.parse(path.read_text(encoding='utf-8-sig'))
              tests=[n.name for n in ast.walk(x) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)) and n.name.startswith('test_')]
              out.append({'test_file':str(path.relative_to(root)),'test_functions':len(tests),'test_names':tests})
          readme=(root/'README.md').read_text(encoding='utf-8-sig')
          req=(root/'requirements.txt').read_text(encoding='utf-8-sig')
          report={'source_sha':'2024f325c24c3626c30193ab27945d9440093c25','student_source_modified':False,
                  'test_files':out,'test_functions_total':sum(f['test_functions'] for f in out),
                  'readme_chars':len(readme),'requirements_chars':len(req),
                  'has_documented_explain':bool(re.search('explain|executionstats',readme,re.I)),
                  'mentions_how_to_install':bool(re.search('pip\\s+install|installation|تثبيت',readme,re.I)),
                  'has_env_example':any((root/n).exists() for n in ('.env.example','env.example','example.env')),
                  'README_requires_env_copy':bool(re.search(r'(?im)\\b(?:cp|copy|نسخ)\\s+(?:\\./)?(?:\\.env\\.example|example\\.env|env\\.example)(?:\\s|$)',readme))}
          pathlib.Path('p18_frozen_student_tests_meta.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\\n')
          print('STUDENT_TESTS',len(out),'FUNCTIONS',report['test_functions_total'],'README_EXPLAIN',report['has_documented_explain'],'REQUIRES_ENV_COPY',report['README_requires_env_copy'])
          PY
          cd student
          python -m pytest tests/test_cleaning_rules.py -q --junitxml=../p18_frozen_cleaning_pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p18-frozen-student-tests-${{ github.run_id }}
          path: |
            p18_frozen_student_tests_meta.json
            p18_frozen_cleaning_pytest.xml
          if-no-files-found: warn
          retention-days: 90
