name: BigData Final Retest P51 P61 Zakaria 2026-10-16
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retest-p51-p61-zakaria-20261016.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  grade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - project_id: P51
            repo: renadalhashdi/big-data-elt-pipeline
            sha: 2f0c81d8341b862d300def33fd5bc89d60a327ab
            student: Renad
          - project_id: P61
            repo: oma4-ai/midterm-data-pipeline
            sha: 07a9a6ebef5ead60c87f9ed6e0a78fefc7e8ae51
            student: Omar
          - project_id: P72
            repo: ZakariaQaria/big-data-project
            sha: 4f83f6f7a64db072f2d4d3ef6689e5ea52001c32
            student: Zakaria
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUNBUFFERED: '1'
      GRADER_PREWARM_SPARK: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GRADER_LLM_PROVIDER: gemini
      GRADER_LLM_MODEL: ${{ vars.GRADER_LLM_MODEL || 'gemini-3.1-pro-preview' }}
      STUDENT_REPOS_TOKEN: ${{ secrets.STUDENT_REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 17df15caeffd60dfcdd325875143ef95a4891902
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install grading environment
        run: python -m pip install -r requirements.txt
      - name: Prepare isolated grade row at exact student SHA
        env:
          PROJECT: ${{ matrix.project_id }}
          REPO: ${{ matrix.repo }}
          SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,os
          with open('submission_groups.csv',newline='',encoding='utf-8-sig') as f:
              rows=list(csv.DictReader(f))
          project=os.environ['PROJECT']
          if project!='P72':
              row=next(x for x in rows if x['project_id']==project).copy()
          else:
              src=next(x for x in rows if x['project_id']=='P45')
              row=src.copy()
              row.update({'project_id':'P72','students':'زكريا يحيى علي قاريه','student_nos':'30','project_title':'','track':''})
          row.update({'repo_url':'https://github.com/'+os.environ['REPO'],'repo_full_name':os.environ['REPO'],'ref':os.environ['SHA'],'stage':'final','grading_mode':'all','historical_policy':'retain_prior_evidence'})
          with open('one_student.csv','w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(row));w.writeheader();w.writerow(row)
          print('Testing',row['project_id'],row['students'],row['repo_full_name'],row['ref'])
          PY
      - name: Freeze and verify source
        env:
          PROJECT: ${{ matrix.project_id }}
          SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          python freeze_submissions.py --submissions one_student.csv --project "$PROJECT" --output-dir frozen
          python freeze_submissions.py --submissions one_student.csv --build-manifest --artifacts-dir frozen --output frozen_submissions.csv
          python - <<'PY'
          import csv,os
          rows=list(csv.DictReader(open('frozen_submissions.csv',encoding='utf-8-sig')))
          row=next(x for x in rows if x['project_id']==os.environ['PROJECT'])
          assert row['freeze_status']=='READY',row
          assert row['commit_sha']==os.environ['SHA'],row
          print('Verified',row['project_id'],row['commit_sha'])
          PY
      - name: Build isolated student runtime
        run: python build_runtime_image.py
      - name: Generate official hidden fixtures
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: |
          set -euo pipefail
          test -n "$HIDDEN_SEED"
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Run both official evaluation suites
        env:
          PROJECT: ${{ matrix.project_id }}
        run: |
          python -u evaluate_project.py \
            --project "$PROJECT" \
            --submissions frozen_submissions.csv \
            --workspace "workspaces/$PROJECT/repo" \
            --mode all \
            --plan-b \
            --network-profile isolated
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-${{ matrix.project_id }}-${{ github.run_id }}
          path: |
            frozen/${{ matrix.project_id }}.metadata.json
            frozen_submissions.csv
            reports_unified/${{ matrix.project_id }}/
            reports/${{ matrix.project_id }}/
            reports_final/${{ matrix.project_id }}/
          if-no-files-found: warn
          retention-days: 90
