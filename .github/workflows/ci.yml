name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile grader
        run: python -m py_compile evaluate.py evaluate_final.py evaluate_project.py evaluate_all.py freeze_submissions.py grader/*.py datasets/*.py
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-pytest-${{ github.run_id }}
          path: pytest-output.txt
          if-no-files-found: warn
          retention-days: 7
