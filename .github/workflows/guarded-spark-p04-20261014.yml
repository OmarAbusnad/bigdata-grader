name: Guarded P04 Spark-Only Recovery 2026-10-14
on:
  push:
    paths:
      - '.grader/trigger-targeted-spark-p04-20261014.txt'
permissions:
  contents: read
  actions: read
jobs:
  p04-spark-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GRADER_PREWARM_SPARK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install grader requirements
        run: python -m pip install -r requirements.txt
      - name: Retrieve immutable P04 freeze
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '37390623044'
          name: frozen-P04-37390623044
          path: frozen_project
      - name: Retrieve original P04 grading evidence
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '37874152827'
          name: unified-P04-37874152827
          path: official_evidence
      - name: Prove matching frozen and originally graded source before execution
        shell: python
        run: |
          import json
          from pathlib import Path
          expected = "f2c2ffd8901d83ed9363f33fd1b49ba5360a9eda"
          frozen = json.loads(Path("frozen_project/P04.metadata.json").read_text(encoding="utf-8"))
          original = json.loads(Path("official_evidence/reports/P04/result.json").read_text(encoding="utf-8"))
          assert frozen.get("project_id") == original.get("project_id") == "P04"
          assert frozen.get("freeze_status") == "READY"
          assert frozen.get("commit_sha") == original.get("commit_sha") == expected, (
            "P04 source SHA mismatch — STOP, no student execution"
          )
          old = ((original.get("runtime") or {}).get("assertions") or {}).get("spark_pipeline.command") or {}
          assert old.get("verdict") in ("FAIL", "INCONCLUSIVE"), "Already PASS — do not rerun"
          archive = Path("frozen_project/P04.repo.tar.gz")
          assert archive.is_file() and archive.stat().st_size == int(frozen.get("snapshot_bytes") or -1)
          print("P04_ORIGINAL_SAME_SHA_VERIFIED=" + expected)
      - name: Extract frozen student sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspaces/P04
          tar -xzf frozen_project/P04.repo.tar.gz -C workspaces/P04
          test -d workspaces/P04/repo
      - name: Build isolated student base once
        run: python build_runtime_image.py
      - name: Recreate original deterministic hidden Spark input
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: |
          test -n "${HIDDEN_SEED:-}" || { echo "::error::Hidden seed unavailable"; exit 2; }
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Retry ONLY original failed P04 Spark test02
        run: |
          python -u targeted_spark_only.py \
            --project P04 \
            --repo workspaces/P04/repo \
            --hidden datasets/hidden \
            --original-report official_evidence/reports/P04/result.json \
            --out reports_spark_recovery/P04/spark_only.json
      - name: Archive Spark-only evidence (do not update grades)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p04-spark-only-proven-guarded-${{ github.run_id }}
          path: reports_spark_recovery/P04/
          if-no-files-found: warn
          retention-days: 90
