name: Targeted P62 Final Upload Only - Preserve Prior Passes

on:
  push:
    paths:
      - '.grader/trigger-targeted-final-ingest.txt'

permissions:
  contents: read
  actions: read

jobs:
  p62-only-failed-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install grader dependencies
        run: python -m pip install -r requirements.txt
      - name: Download immutable frozen project P62
        uses: actions/download-artifact@v4
        with:
          name: frozen-P62-37390623044
          path: frozen_project
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37390623044'
      - name: Restore P62 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspaces/P62/repo
          tar -xzf frozen_project/P62.repo.tar.gz -C workspaces/P62
      - name: Prepare isolated student base image
        run: python build_runtime_image.py
      - name: Regenerate original deterministic input (no oracle mount to student)
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: |
          test -n "${HIDDEN_SEED:-}" || exit 2
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Execute only previously FAIL final.api.ingest; no other Final endpoints
        run: |
          python -u targeted_final_ingest.py \
            --project P62 \
            --repo workspaces/P62/repo \
            --hidden datasets/hidden \
            --api-target src.phase2.api:app \
            --db midterm_pipeline \
            --out reports_targeted_final/P62/ingest_only.json
      - name: Upload isolated P62 finding
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-final-ingest-P62-${{ github.run_id }}
          path: reports_targeted_final/P62/
          if-no-files-found: error
          retention-days: 30
