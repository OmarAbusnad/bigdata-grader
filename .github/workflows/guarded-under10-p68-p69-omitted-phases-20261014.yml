name: Under10 P68 Final and P69 Midterm Omitted-Phase Validation 2026-10-14
on:
  push:
    paths:
      - '.grader/trigger-under10-p68-p69-omitted-phases-20261014.txt'
permissions:
  contents: read
  actions: read
jobs:
  test-only-omitted-phase-on-cutoff-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {project_id: P68, mode: final, expected_sha: 1c0b2b4652e51c33209f6a89e7a580100276f591, old_mode: midterm}
          - {project_id: P69, mode: midterm, expected_sha: cfce6b1d0b0b8fcae26a6b6f2e805c10479539cf, old_mode: final}
    env:
      PYTHONUNBUFFERED: '1'
      GRADER_PREWARM_SPARK: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GRADER_LLM_PROVIDER: gemini
      GRADER_LLM_MODEL: ${{ vars.GRADER_LLM_MODEL || 'gemini-3.1-pro-preview' }}
      STUDENT_REPOS_TOKEN: ${{ secrets.STUDENT_REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install grader requirements
        run: python -m pip install -r requirements.txt
      - name: Read original artifact to prove missing phase
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '38632370130'
          name: under10-deadline-${{ matrix.project_id }}-38632370130
          path: old_assessment
      - name: Guard exact SHA, deadline, original stage and no previous grade evidence for requested stage
        shell: python
        run: |
          import csv,datetime,json,pathlib
          p="${{ matrix.project_id }}"; mode="${{ matrix.mode }}"; old_mode="${{ matrix.old_mode }}"
          sha="${{ matrix.expected_sha }}"
          assert (p,mode,old_mode) in {("P68","final","midterm"),("P69","midterm","final")}
          d=json.loads(pathlib.Path("docs/under10_chance_deadline_sources_20261014.json").read_text())
          v=next(x for x in d["rows"] if x["id"]==p)
          assert v["cutoff_sha"]==sha and v["mode"]==old_mode
          assert datetime.datetime.fromisoformat(v["commit_date"].replace("Z","+00:00")) <= datetime.datetime.fromisoformat(d["cutoff_utc"].replace("Z","+00:00"))
          with open("chance_under10_20261014.csv",encoding="utf-8-sig",newline="") as f:
              s=next(x for x in csv.DictReader(f) if x["project_id"]==p)
          assert s["ref"]==sha and s["grading_mode"]==old_mode
          prior=json.loads((pathlib.Path("old_assessment/frozen")/(p+".metadata.json")).read_text())
          assert prior["commit_sha"]==sha and prior["freeze_status"]=="READY",prior
          old_path=pathlib.Path("old_assessment")/("reports_final" if mode=="final" else "reports")/p/"result.json"
          assert not old_path.exists(),f"Requested phase was graded already: {old_path}"
          print("MISSING_PHASE_VERIFIED",p,mode,sha)
      - name: Freeze deadline-accepted exact student commit
        shell: bash
        run: |
          set -euo pipefail
          python freeze_submissions.py --submissions chance_under10_20261014.csv --project "${{ matrix.project_id }}" --output-dir frozen
          python freeze_submissions.py --submissions chance_under10_20261014.csv --build-manifest --artifacts-dir frozen --output frozen_submissions.csv
          python - <<'PY'
          import csv,json,pathlib
          p="${{ matrix.project_id }}"; expected="${{ matrix.expected_sha }}"
          m=json.loads((pathlib.Path("frozen")/(p+".metadata.json")).read_text())
          assert m["freeze_status"]=="READY" and m["commit_sha"]==expected,m
          with open("frozen_submissions.csv",encoding="utf-8-sig",newline="") as f:
              s=next(x for x in csv.DictReader(f) if x["project_id"]==p)
          assert s["freeze_status"]=="READY" and s["commit_sha"]==expected
          print("EXACT_SHA_PINNED",p,expected)
          PY
      - name: Build isolated grader runtime
        run: python build_runtime_image.py
      - name: Generate same hidden fixtures inside grader sandbox
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HIDDEN_SEED:-}" || { echo "Hidden fixture secret missing"; exit 2; }
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Grade ONLY omitted phase without repeating previously successful student stages
        shell: bash
        run: |
          set -euo pipefail
          python -u evaluate_project.py \
            --project "${{ matrix.project_id }}" \
            --submissions frozen_submissions.csv \
            --workspace "workspaces/${{ matrix.project_id }}/repo" \
            --mode "${{ matrix.mode }}" \
            --network-profile isolated
      - name: Save independent exact-SHA evidence even if student phase fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: under10-omitted-phase-${{ matrix.project_id }}-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            frozen/${{ matrix.project_id }}.metadata.json
            frozen_submissions.csv
            reports_unified/${{ matrix.project_id }}/
            reports/${{ matrix.project_id }}/
            reports_final/${{ matrix.project_id }}/
          if-no-files-found: warn
          retention-days: 90
