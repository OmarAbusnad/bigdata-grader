name: Read-only Full Project Grade Evidence Readiness
on:
  push:
    paths:
      - '.grader/trigger-evidence-readiness-20261014.txt'
permissions:
  contents: write
  actions: read
jobs:
  reconcile-no-student-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '38196458648'
          name: final-evidence-ledger-with-P41-38196458648
          path: .audit/base
      - name: Download latest accepted P01/P26 assessment reports (no student code)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 38424927615 -n diagnostic-undeclared-deps-P01-38424927615 -D .audit/P01
          gh run download 38317234359 -n late-grading-P26-38317234359 -D .audit/P26
      - name: Verify ACTIVE rubrics; preserve historical PASS and separate later SHAs
        run: |
          python tools/compile_reconciliation_readiness.py \
            --ledger .audit/base/ledger.json \
            --register project-results/2026-10-14/targeted/EVIDENCE_REGISTER.json \
            --rubric-mid rubrics/midterm_18.json \
            --rubric-final rubrics/final_7.json \
            --submissions submission_groups.csv \
            --p01-mid .audit/P01/reports/P01/result.json \
            --p01-final .audit/P01/reports_final/P01/result.json \
            --p26-mid .audit/P26/reports/P26/result.json \
            --p26-final .audit/P26/reports_final/P26/result.json \
            --output project-results/2026-10-14/reconciliation
      - name: Upload independent audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readonly-grade-readiness-${{ github.run_id }}
          path: |
            project-results/2026-10-14/reconciliation
            project-results/P*/forensics/RECONCILIATION_READINESS_20261014.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit non-sensitive project evidence and pending grade queue
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-results/2026-10-14/reconciliation project-results/P*/forensics/RECONCILIATION_READINESS_20261014.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: write exact-SHA preliminary grade reconciliation per project'
            git push origin HEAD:${{ github.ref_name }}
          fi
