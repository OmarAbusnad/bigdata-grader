name: P63 Updated Submission Final-Only Independent Verification
on:
  push:
    paths:
      - '.grader/trigger-p63-final-only-20261016.txt'
permissions:
  contents: read
jobs:
  p63-final-only:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      GRADER_PREWARM_SPARK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install grader
        run: python -m pip install -r requirements.txt
      - name: Checkout exact new P63 source without edits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspaces/P63
          git clone -q https://github.com/mohammedalhaj113837-hue/hybrid-elt-bigdata-pipeline.git workspaces/P63/repo
          git -C workspaces/P63/repo checkout -q --detach 1031e76a8482abe14b95ffd8449b9cd850b9d291
          test "$(git -C workspaces/P63/repo rev-parse HEAD)" = '1031e76a8482abe14b95ffd8449b9cd850b9d291'
          python - <<'PY'
          import csv
          with open('frozen_submissions.csv','w',encoding='utf-8-sig',newline='') as f:
            fieldnames=['project_id','students','student_nos','repo_url','commit_sha','ref','workspace_subdir','freeze_status']
            w=csv.DictWriter(f,fieldnames=fieldnames);w.writeheader()
            w.writerow({'project_id':'P63','students':'محمد انور علي احمد الحاج','student_nos':'','repo_url':'https://github.com/mohammedalhaj113837-hue/hybrid-elt-bigdata-pipeline','commit_sha':'1031e76a8482abe14b95ffd8449b9cd850b9d291','ref':'1031e76a8482abe14b95ffd8449b9cd850b9d291','workspace_subdir':'','freeze_status':'READY'})
          PY
      - name: Build grader sandbox
        run: python build_runtime_image.py
      - name: Deterministic fixture preparation
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: |
          test -n "${HIDDEN_SEED:-}"
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Assess final only on updated exact SHA
        run: |
          python -u evaluate_project.py \
            --project P63 --submissions frozen_submissions.csv \
            --workspace workspaces/P63/repo --mode final \
            --network-profile isolated --no-ai --allow-low-confidence --timeout 900
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p63-new-commit-independent-final-${{ github.run_id }}
          path: |
            frozen_submissions.csv
            reports_unified/P63/
            reports_final/P63/
          if-no-files-found: warn
          retention-days: 90
