name: P01 Read-only Exact SHA API Import Blocker Diagnosis
on:
  push:
    paths:
      - '.grader/trigger-p01-api-only-diagnosis-20261014.txt'
permissions:
  contents: write
  actions: read
jobs:
  only-failed-p01-api-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '38624013769'
          name: later-exact-source-P01-38624013769
          path: latest_source
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          run-id: '38424927615'
          name: diagnostic-undeclared-deps-P01-38424927615
          path: assessed
      - name: Verify exact latest SHA + original query eligibility
        shell: python
        run: |
          import json,hashlib,pathlib
          sha="c43aae3d5e9c0d96731640206752f886f2618497"
          meta=json.loads(pathlib.Path("latest_source/provenance.json").read_text())
          assert meta["project_id"]=="P01" and meta["exact_student_sha"]==sha
          tar=pathlib.Path("latest_source/repo.tar.gz")
          assert hashlib.sha256(tar.read_bytes()).hexdigest()==pathlib.Path("latest_source/archive.sha256").read_text().split()[0]
          a=json.loads(pathlib.Path("assessed/reports_final/P01/result.json").read_text())
          assert a["project_id"]=="P01" and a["commit_sha"]==sha
          entries=(a.get("runtime") or {}).get("assertions") or []
          item=next((v for v in entries if isinstance(v,dict) and v.get("key")=="final.queries.runtime"),None) if isinstance(entries,list) else entries.get("final.queries.runtime")
          assert item and item.get("verdict") in ("FAIL","INCONCLUSIVE")
      - name: Restore frozen source only
        run: |
          set -euo pipefail
          mkdir -p workspaces/P01/repo
          tar -xzf latest_source/repo.tar.gz -C workspaces/P01/repo
      - name: Build isolated runner base
        run: python build_runtime_image.py
      - name: Probe one API import precondition, not actual student queries
        run: |
          python -u tools/targeted_p01_api_import_diagnosis.py \
            --repo workspaces/P01/repo \
            --out project-results/P01/forensics/LATER_SHA_API_IMPORT_DIAGNOSIS_20261014.json
      - name: Upload independent proof even if Git write fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-later-api-startup-diagnosis-${{ github.run_id }}
          path: project-results/P01/forensics/LATER_SHA_API_IMPORT_DIAGNOSIS_20261014.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit redacted, student-specific report to project results
        if: success()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-results/P01/forensics/LATER_SHA_API_IMPORT_DIAGNOSIS_20261014.json
          git diff --cached --quiet || {
            git commit -m 'evidence(P01): record exact SHA isolated API startup cause, no grades'
            git push origin HEAD:${{ github.ref_name }}
          }
