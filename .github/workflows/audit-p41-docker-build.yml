name: Verify P41 Docker dependency build only
on:
  push:
    branches:
      - audit/verify-p41-frozen-requirements-20261012
    paths:
      - .github/workflows/audit-p41-docker-build.yml
permissions:
  contents: read
  actions: read
jobs:
  dependency-build-only:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download frozen P41 submission
        uses: actions/download-artifact@v4
        with:
          name: frozen-P41-37390623044
          path: frozen_project
          repository: ${{ github.repository }}
          run-id: '37390623044'
          github-token: ${{ github.token }}
      - name: Extract frozen snapshot and build base Docker image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspaces/P41
          tar -xzf frozen_project/P41.repo.tar.gz -C workspaces/P41
          python build_runtime_image.py
      - name: Build frozen P41 dependencies in Docker without starting students
        shell: bash
        env:
          GRADER_PREWARM_SPARK: '0'
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          from grader.sandbox import DockerSandbox
          sb = DockerSandbox(Path.cwd()/"audit_p41", "P41", Path.cwd()/"workspaces/P41/repo",
                             Path.cwd()/".no_hidden_data")
          result=sb.build()
          evidence={"project":"P41","frozen_run":37390623044,
                    "docker_dependency_build":result["ok"],
                    "returncode":result["returncode"],
                    "seconds":result["elapsed_seconds"],
                    "grader_prewarm_enabled":False,
                    "student_program_executed":False,
                    "stderr_tail":str(result.get("stderr_tail") or "")[-5000:]}
          Path("p41-dependency-build-proof.json").write_text(json.dumps(evidence,indent=2))
          print("P41 dependency image build:",evidence["docker_dependency_build"],
                "returncode:",evidence["returncode"])
          if not result["ok"]:
              print(evidence["stderr_tail"][-3000:])
              sys.exit(1)
          PY
      - name: Save Docker dependency build proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p41-docker-build-proof-${{ github.run_id }}
          path: p41-dependency-build-proof.json
          if-no-files-found: warn
          retention-days: 30
