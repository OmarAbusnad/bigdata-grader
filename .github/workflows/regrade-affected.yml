name: Regrade Affected Projects (fixed grader, frozen sources)

# Manual only. Re-runs ONLY the listed projects from their immutable frozen snapshot with the
# format-tolerant grader (4.4 / final 1.3). Original artifacts are never modified; the master
# ledger merges the result (a PASS is never replaced).
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Comma-separated project ids (the affected set)'
        required: true
        default: 'P03,P04,P05,P09,P11,P13,P14,P15,P19,P21,P23,P24,P26,P27,P30,P32,P33,P34,P35,P36,P37,P38,P40,P42,P44,P45,P46,P47,P48,P49,P50,P51,P52,P53,P55,P56,P57,P58,P60,P62,P63,P64,P66'
      freeze_run_id:
        description: 'Freeze run that holds the immutable snapshots'
        required: true
        default: '37390623044'
      mode:
        description: 'Suites to run'
        required: true
        default: all
        type: choice
        options: [all, midterm, final]
      max_parallel:
        description: 'Projects graded in parallel'
        required: true
        default: '3'
        type: choice
        options: ['1', '2', '3', '4']

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.read.outputs.projects }}
    steps:
      - id: read
        shell: python
        env:
          REQUESTED: ${{ inputs.projects }}
        run: |
          import json, os, re
          ids = [x.strip().upper() for x in os.environ['REQUESTED'].split(',') if x.strip()]
          bad = [x for x in ids if not re.fullmatch(r'P\d{2}', x)]
          if bad or not ids:
              raise SystemExit(f'Invalid project ids: {bad or "empty list"}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('projects=' + json.dumps(sorted(set(ids))) + '\n')

  regrade:
    needs: matrix
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        project_id: ${{ fromJSON(needs.matrix.outputs.projects) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GRADER_LLM_PROVIDER: gemini
      GRADER_LLM_MODEL: ${{ vars.GRADER_LLM_MODEL || 'gemini-3.1-pro-preview' }}
      GRADER_PREWARM_SPARK: '1'
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate secrets
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: |
          test -n "${HIDDEN_SEED:-}" || exit 2
          test -n "${GEMINI_API_KEY:-}" || exit 2
      - name: Download frozen manifest
        uses: actions/download-artifact@v4
        with:
          name: frozen-manifest-${{ inputs.freeze_run_id }}
          path: freeze_manifest
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.freeze_run_id }}
      - name: Download frozen project snapshot
        uses: actions/download-artifact@v4
        with:
          name: frozen-${{ matrix.project_id }}-${{ inputs.freeze_run_id }}
          path: frozen_project
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.freeze_run_id }}
      - name: Restore immutable repository snapshot
        shell: bash
        run: |
          set -euo pipefail
          pid="${{ matrix.project_id }}"
          mkdir -p "workspaces/$pid/repo"
          tar -xzf "frozen_project/$pid.repo.tar.gz" -C "workspaces/$pid"
          cp freeze_manifest/frozen_submissions.csv frozen_submissions.csv
          echo "TARGET_WORKSPACE=workspaces/$pid/repo" >> "$GITHUB_ENV"
      - name: Safe extraction of the frozen archive (P24 / P52 only)
        if: ${{ matrix.project_id == 'P24' || matrix.project_id == 'P52' }}
        shell: bash
        run: |
          set -euo pipefail
          pid="${{ matrix.project_id }}"
          python -m pip install 'rarfile>=4.2,<5'
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools
          case "$pid" in
            P24) archive="midterm-data-pipeline.rar" ;;
            P52) archive="saad hassan.zip" ;;
          esac
          python -m grader.safe_archive_submission \
            --frozen-repo "workspaces/$pid/repo" \
            --out "extracted_student/$pid" \
            --archive-basename "$archive" \
            --proof "reports_archive_recovery/$pid/extraction_proof.json"
          root="$(python -c "import json,sys;print(json.load(open('reports_archive_recovery/$pid/extraction_proof.json',encoding='utf-8'))['source_root'])")"
          echo "TARGET_WORKSPACE=$root" >> "$GITHUB_ENV"
      - name: Build base runtime image
        run: python build_runtime_image.py
      - name: Generate identical hidden pack
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Unified project evaluation (fixed grader)
        shell: bash
        run: |
          python -u evaluate_project.py \
            --project "${{ matrix.project_id }}" \
            --submissions frozen_submissions.csv \
            --workspace "$TARGET_WORKSPACE" \
            --mode "${{ inputs.mode }}" \
            --network-profile isolated \
            --plan-b
      - name: Upload regrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regrade-${{ matrix.project_id }}-${{ github.run_id }}
          path: |
            reports/${{ matrix.project_id }}/
            reports_final/${{ matrix.project_id }}/
            reports_unified/${{ matrix.project_id }}/
            reports_archive_recovery/${{ matrix.project_id }}/
          if-no-files-found: warn
          retention-days: 90
