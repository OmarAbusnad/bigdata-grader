name: P46 Exact-SHA Scheduled Jobs Independent Probe
on:
  push:
    paths:
      - '.grader/trigger-p46-jobs-exact-sha.txt'
permissions:
  contents: read
jobs:
  p46-independent-job-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      EXPECTED_SHA: c66ac3f53de2db27359ce2345b02e67b1cea9a33
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze unmodified exact student SHA
        run: |
          git clone --quiet https://github.com/AihamAlqasem/Enterprise-Grade-Data-Ingestion-ELT-Pipeline.git student
          git -C student checkout --detach "$EXPECTED_SHA"
          test "$(git -C student rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "SOURCE_EXACT_SHA=$EXPECTED_SHA"
      - name: Install only student-declared dependencies for final jobs (no Spark execution)
        run: |
          python -m pip install 'pymongo==4.17.0' 'schedule==1.2.2' 'fastapi==0.128.0' 'uvicorn==0.39.0' 'httpx==0.28.1'
      - name: Exercise documented jobs via actual FastAPI and MongoDB
        shell: bash
        run: |
          set -euo pipefail
          cd student
          python -m uvicorn src.api:app --host 127.0.0.1 --port 8000 >/tmp/p46-uvicorn.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true; cat /tmp/p46-uvicorn.log | tail -60' EXIT
          python - <<'PY'
          import json,time,sys,os,pathlib
          import httpx,pymongo
          base='http://127.0.0.1:8000'
          for attempt in range(35):
              try:
                  rr=httpx.get(base+'/health',timeout=2)
                  if rr.status_code==200: break
              except Exception: pass
              time.sleep(1)
          else: raise AssertionError('Student API did not launch')
          db=pymongo.MongoClient('mongodb://localhost:27017/',serverSelectionTimeoutMS=8000)['for_test']
          db.orders_validated.insert_one({'order_id':'AUDIT-P46-001','order_date':'2026-10-14T12:00:00','payment_method':'wallet','status':'completed','city':'Sanaa'})
          listed=httpx.get(base+'/jobs',timeout=15)
          manual={}
          for job in ('update_views','generate_report'):
              resp=httpx.post(base+'/jobs/'+job+'/run',timeout=30)
              manual[job]={'http_code':resp.status_code,'body':resp.json()}
          after=httpx.get(base+'/jobs',timeout=15)
          logs=list(db.jobs_log.find({}, {'_id':0}))
          names={str(row.get('job_name')):str(row.get('status')) for row in logs}
          daily=list(db.daily_sales_mv.find({}, {'_id':0}))
          jsonfile=pathlib.Path('reports/latest_payment_report.json')
          report=json.loads(jsonfile.read_text('utf-8')) if jsonfile.exists() else None
          observed={'source_sha':os.getenv('EXPECTED_SHA'), 'initial_jobs_body':listed.json(),'job_calls':manual,'jobs_after':after.json(),'logged_job_statuses':names,'log_fields':[sorted(row.keys()) for row in logs],'daily_view_rows':len(daily),'generated_report_exists':jsonfile.exists(),'generated_report_rows':len(report) if isinstance(report,list) else None, 'api_process_sha_match':True}
          pathlib.Path('../p46_independent_job_probe.json').write_text(json.dumps(observed,ensure_ascii=False,indent=2),encoding='utf-8')
          print('INDEPENDENT_P46_PROBE_JSON='+json.dumps(observed,ensure_ascii=False))
          assert all(item['http_code']==200 for item in manual.values()),'HTTP fail'
          assert len(logs)>=2 and all(str(z.get('status'))=='Success' for z in logs), 'Student job body returns success but logs show execution failure'
          assert daily and jsonfile.exists(), 'Actual jobs did not persist output'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p46-exact-sha-independent-jobs-${{ github.run_id }}
          path: |
            p46_independent_job_probe.json
          if-no-files-found: warn
          retention-days: 90
