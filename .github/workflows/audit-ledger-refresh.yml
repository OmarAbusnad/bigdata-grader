name: Verify latest ledger evidence, no student runs
on:
  push:
    branches:
      - audit/verify-ledger-refresh-20261012
    paths:
      - .github/workflows/audit-ledger-refresh.yml
permissions:
  contents: read
  actions: read
jobs:
  audit-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_ledger.py tests/test_ledger_evidence_freshness.py
      - uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: '37874152827'
          pattern: unified-P*-37874152827
          path: evidence/base
          github-token: ${{ github.token }}
      - name: Fetch historical evidence files only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: '37982763274,37983268895,37984555642,37986423624,38000458514,38003977105,38004329576,38004638719,38004806202,38004899802,38005530245,38005533393,38015912512,38016947468,38079787463,38088837812,38096258510,38099290754'
        run: |
          set -euo pipefail
          for run in ${RUNS//,/ }; do
            mkdir -p "evidence/overlays/$run"
            gh run download "$run" --repo "${{ github.repository }}" --dir "evidence/overlays/$run"
            test -n "$(find "evidence/overlays/$run" -type f -print -quit)"
          done
      - name: Build candidate and verify evidence freshness
        shell: bash
        env:
          RUNS: '37982763274,37983268895,37984555642,37986423624,38000458514,38003977105,38004329576,38004638719,38004806202,38004899802,38005530245,38005533393,38015912512,38016947468,38079787463,38088837812,38096258510,38099290754'
        run: |
          set -euo pipefail
          args=()
          for run in ${RUNS//,/ }; do args+=(--overlay "$run:evidence/overlays/$run"); done
          python build_ledger.py --base evidence/base --base-run 37874152827 \
            "${args[@]}" --out evidence_updated \
            --final-explain-rule --frozen-http-preconditions --expected-projects 68
          python - <<'PY'
          import csv,json
          from collections import Counter
          from pathlib import Path
          j=json.loads(Path("evidence_updated/ledger.json").read_text())
          counts=Counter(e["verdict"] for p in j["projects"].values() for ph in p["phases"].values() for e in ph["entries"].values())
          assert (counts["PASS"],counts["FAIL"],counts["INCONCLUSIVE"]) == (2651,348,681), counts
          assert len(j["projects"]) == 68 and j["invariants"]["ok"]
          assert j["invariants"]["baseline_pass_preserved"] == j["invariants"]["baseline_pass_total"] == 2022
          assert not j["rejected"] and not j["pass_overrides"]
          updated=j["projects"]["P37"]["phases"]["midterm"]["entries"]["batch.validated_count"]
          assert updated["verdict"] == "FAIL" and str(updated["actual"]) == "18250", updated
          assert updated["origin"]["run_id"] == 38088837812
          changes=sum(s.get("evidence_refreshes",0) for s in j["sources"] if s.get("type")=="overlay_dir")
          assert changes > 0, "Evidence refresh audit must not be silently empty"
          with Path("evidence_updated/source_audit.csv").open(encoding="utf-8-sig",newline="") as fh:
            audit=list(csv.DictReader(fh))
          assert len(audit)==18
          assert sum(int(x["evidence_refreshes"]) for x in audit)==changes
          print(json.dumps({"projects":68,"verdicts":dict(counts),"baseline_pass":2022,
                            "refreshes":changes,"P37_latest_fail_observed":updated["actual"]},ensure_ascii=False))
          PY
      - name: Upload verified updated evidence ledger
        uses: actions/upload-artifact@v4
        with:
          name: verified-evidence-refreshed-ledger-${{ github.run_id }}
          path: evidence_updated/
          retention-days: 90
