name: Validate reconciled ledger (temporary audit only)
on:
  push:
    branches:
      - audit/ledger-overlay-runs-20261012
    paths:
      - .github/workflows/validate-ledger-evidence.yml

permissions:
  contents: read
  actions: read

jobs:
  verify-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_ledger.py
      - name: Download immutable baseline
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: '37874152827'
          pattern: 'unified-P*-37874152827'
          path: evidence/base
          github-token: ${{ github.token }}
      - name: Download all reviewed evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: '37982763274,37983268895,37984555642,37986423624,38000458514,38003977105,38004329576,38004638719,38004806202,38004899802,38005530245,38005533393,38015912512,38016947468,38079787463,38088837812,38096258510,38099290754'
        shell: bash
        run: |
          set -euo pipefail
          for run in ${RUNS//,/ }; do
            mkdir -p "evidence/overlays/$run"
            gh run download "$run" --repo "${{ github.repository }}" --dir "evidence/overlays/$run"
            test -n "$(find "evidence/overlays/$run" -type f -print -quit)"
          done
      - name: Build and verify candidate ledger
        shell: bash
        env:
          RUNS: '37982763274,37983268895,37984555642,37986423624,38000458514,38003977105,38004329576,38004638719,38004806202,38004899802,38005530245,38005533393,38015912512,38016947468,38079787463,38088837812,38096258510,38099290754'
        run: |
          set -euo pipefail
          args=()
          for run in ${RUNS//,/ }; do args+=(--overlay "$run:evidence/overlays/$run"); done
          python build_ledger.py --base evidence/base --base-run 37874152827 \
            "${args[@]}" --out candidate_ledger \
            --final-explain-rule --frozen-http-preconditions --expected-projects 68
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          j=json.loads(Path('candidate_ledger/ledger.json').read_text())
          c=Counter(e['verdict'] for p in j['projects'].values() for phase in p['phases'].values() for e in phase['entries'].values())
          i=j['invariants']
          actual={k:c[k] for k in ('PASS','FAIL','INCONCLUSIVE')}
          print('Candidate verdict totals:',actual,'sources:',len(j['sources']),'conflicts:',len(j['conflicts']))
          assert actual=={'PASS':2651,'FAIL':348,'INCONCLUSIVE':681}, 'Reconciled verdict totals differ from independently verified local evidence'
          assert i['ok'] and i['baseline_pass_total']==2022 and i['baseline_pass_preserved']==2022
          assert not j['rejected'] and not j['pass_overrides']
          expected=[int(x) for x in '37982763274,37983268895,37984555642,37986423624,38000458514,38003977105,38004329576,38004638719,38004806202,38004899802,38005530245,38005533393,38015912512,38016947468,38079787463,38088837812,38096258510,38099290754'.split(',')]
          seen=[s['run_id'] for s in j['sources'] if s['type']=='overlay_dir']
          assert seen==expected,(seen,expected)
          assert all(s['ignored_files']==0 for s in j['sources'] if s['type']=='overlay_dir')
          print('Candidate evidence reconciliation VERIFIED; academic grades remain unapproved')
          PY
      - name: Upload independently verified ledger candidate
        uses: actions/upload-artifact@v4
        with:
          name: verified-ledger-candidate-${{ github.run_id }}
          path: candidate_ledger/
          retention-days: 90
