name: P51 Rinad Latest Commit Targeted Midterm and Final
on:
  push:
    paths:
      - '.grader/trigger-p51-new-20261016.txt'
permissions:
  contents: read
  actions: read
jobs:
  p51-targeted:
    name: P51 ${{ matrix.mode }} Latest SHA
    runs-on: ubuntu-latest
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        mode: [midterm, final]
    env:
      PYTHONUNBUFFERED: '1'
      GRADER_PREWARM_SPARK: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GRADER_LLM_PROVIDER: gemini
      GRADER_LLM_MODEL: ${{ vars.GRADER_LLM_MODEL || 'gemini-3.1-pro-preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install evaluator requirements
        run: python -m pip install -r requirements.txt
      - name: Fetch P51 precise post-repair SHA and verify it is unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workspaces/P51
          git clone -q https://github.com/renadalhashdi/big-data-elt-pipeline.git workspaces/P51/repo
          git -C workspaces/P51/repo checkout -q --detach 2f0c81d8341b862d300def33fd5bc89d60a327ab
          test "$(git -C workspaces/P51/repo rev-parse HEAD)" = '2f0c81d8341b862d300def33fd5bc89d60a327ab'
          python - <<'PY'
          import csv
          with open('frozen_submissions.csv','w',encoding='utf-8-sig',newline='') as f:
              cols=['project_id','students','student_nos','repo_url','commit_sha','ref','workspace_subdir','freeze_status']
              w=csv.DictWriter(f,fieldnames=cols);w.writeheader()
              w.writerow({'project_id':'P51','students':'ريناد عبدالخالق يحيى الحاشدي','student_nos':'','repo_url':'https://github.com/renadalhashdi/big-data-elt-pipeline','commit_sha':'2f0c81d8341b862d300def33fd5bc89d60a327ab','ref':'2f0c81d8341b862d300def33fd5bc89d60a327ab','workspace_subdir':'','freeze_status':'READY'})
          print('P51_FIXED_SHA=2f0c81d8341b862d300def33fd5bc89d60a327ab')
          PY
      - name: Build isolated grader execution image
        run: python build_runtime_image.py
      - name: Prepare identical private test fixtures
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${HIDDEN_SEED:-}"
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Evaluate ${{ matrix.mode }} on exact latest SHA
        run: |
          python -u evaluate_project.py --project P51 \
            --submissions frozen_submissions.csv \
            --workspace workspaces/P51/repo --mode "${{ matrix.mode }}" \
            --plan-b --allow-low-confidence --no-ai \
            --network-profile isolated --timeout 1100
      - name: Save independent P51 ${{ matrix.mode }} complete evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p51-latest-${{ matrix.mode }}-${{ github.run_id }}
          path: |
            frozen_submissions.csv
            reports/P51/
            reports_unified/P51/
            reports_final/P51/
          if-no-files-found: warn
          retention-days: 90
