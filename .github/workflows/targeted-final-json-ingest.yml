name: Targeted P32 P42 Final JSON Ingest Only
on:
  push:
    paths:
      - '.grader/trigger-targeted-final-json-ingest.txt'
permissions:
  contents: read
  actions: read
jobs:
  ingest-only:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        project_id: [P32, P42]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install grader dependencies
        run: python -m pip install -r requirements.txt
      - name: Get only original frozen student source
        uses: actions/download-artifact@v4
        with:
          name: frozen-${{ matrix.project_id }}-37390623044
          path: frozen_project
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '37390623044'
      - name: Restore frozen source without modification
        shell: bash
        run: |
          set -euo pipefail
          pid="${{ matrix.project_id }}"
          mkdir -p "workspaces/$pid/repo"
          tar -xzf "frozen_project/$pid.repo.tar.gz" -C "workspaces/$pid"
      - name: Build isolated student runtime
        run: python build_runtime_image.py
      - name: Generate deterministic original Midterm CSV input
        env:
          HIDDEN_SEED: ${{ secrets.GRADER_HIDDEN_SEED }}
        run: |
          test -n "${HIDDEN_SEED:-}" || exit 2
          python datasets/prepare_hidden_tests.py --regenerate --seed "$HIDDEN_SEED"
      - name: Execute ONLY original failed Final POST /ingest
        shell: bash
        run: |
          set -euo pipefail
          pid="${{ matrix.project_id }}"
          python -u targeted_final_json_ingest.py \
            --project "$pid" \
            --repo "workspaces/$pid/repo" \
            --hidden datasets/hidden \
            --out "reports_targeted_ingest/$pid/result.json"
      - name: Archive proof, do not modify original PASS tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: targeted-ingest-${{ matrix.project_id }}-${{ github.run_id }}
          path: reports_targeted_ingest/${{ matrix.project_id }}/
          if-no-files-found: warn
          retention-days: 90
