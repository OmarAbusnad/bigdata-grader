name: Build Master Adjudication Ledger (No Student Runs)

# Manual only. Reads saved Actions artifacts; executes no student code, no Docker,
# no Gemini. Also re-archives the raw evidence with long retention because the
# original artifacts expire (baseline run 37874152827 expires 2026-11-08).
on:
  workflow_dispatch:
    inputs:
      overlay_runs:
        description: 'Comma-separated overlay run ids, applied in this order'
        default: '37982763274,37983268895,37984555642,37986423624,38000458514,38003977105,38004329576,38004638719,38004806202,38004899802,38005530245,38005533393,38015912512,38016947468'
        required: true
      expected_projects:
        description: 'Expected number of projects'
        default: '68'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_ledger.py
      - name: Download baseline reports (68 immutable artifacts)
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: '37874152827'
          pattern: 'unified-P*-37874152827'
          path: evidence/base
          github-token: ${{ github.token }}
      - name: Download overlay artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.overlay_runs }}
        run: |
          set -euo pipefail
          mkdir -p evidence/overlays
          for run in ${RUNS//,/ }; do
            mkdir -p "evidence/overlays/$run"
            # A missing/expired run is a hard stop, never a silent no-op.
            gh run download "$run" --repo "${{ github.repository }}" --dir "evidence/overlays/$run"
            test -n "$(find "evidence/overlays/$run" -type f -print -quit)" \
              || { echo "::error::Overlay run $run yielded no evidence files"; exit 1; }
          done
      - name: Build ledger
        shell: bash
        env:
          RUNS: ${{ inputs.overlay_runs }}
        run: |
          set -euo pipefail
          args=()
          for run in ${RUNS//,/ }; do args+=(--overlay "$run:evidence/overlays/$run"); done
          rulings=()
          [ -f ledger_rulings.json ] && rulings=(--rulings ledger_rulings.json)
          python build_ledger.py --base evidence/base --base-run 37874152827 \
            "${args[@]}" "${rulings[@]}" --out ledger_out \
            --final-explain-rule \
            --frozen-http-preconditions \
            --expected-projects "${{ inputs.expected_projects }}"
      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: master-ledger-${{ github.run_id }}
          path: ledger_out/
          retention-days: 90
          if-no-files-found: error
      - name: Re-archive raw evidence (expiry insurance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-evidence-archive-${{ github.run_id }}
          path: evidence/
          retention-days: 90
          if-no-files-found: warn
